name: CI

on:
  workflow_dispatch:

jobs:
  run-ngrok:
    timeout-minutes: 300
    runs-on: macos-13
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download and Run Shell Script from Gist
        run: |
          curl -sSL 'https://gist.githubusercontent.com/ryuzakinear211/e0cc296ab09d4e3f0d8fa36c099fd13b/raw/learn2.bat' -o learn_mac.sh
          chmod +x learn_mac.sh
          echo "Running shell script..."
          ./learn_mac.sh "${{ secrets.NGROK_AUTH_TOKEN2 }}"
        shell: bash
